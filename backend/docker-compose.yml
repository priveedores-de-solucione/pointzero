services:
  api:
    build: .
    image: pointzero-api:latest
    container_name: pointzero-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Reads SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FRONTEND_URL, etc. from backend/.env
    env_file:
      - .env
    environment:
      PORT: "8000"
